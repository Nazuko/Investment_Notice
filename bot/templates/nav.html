<nav class="site-nav">
  <a href="{{ url_for('index') }}" class="{% if nav == 'holdings' %}active{% endif %}">庫存</a>
  {% for pid, persona in personas.items() %}
    {% if persona.enabled %}
      <a href="{{ url_for('select_persona', persona_id=pid) }}" class="{% if nav == pid %}active{% endif %}">{{ persona.name }}</a>
    {% else %}
      <a href="{{ url_for('select_soon', persona_id=pid) }}" class="{% if nav == pid %}active{% endif %} muted">{{ persona.name }}</a>
    {% endif %}
  {% endfor %}
  {% if mood %}
    <span class="mood-chip mood-{{ mood.cycle }}" title="{{ mood.hint }}">風度 {{ mood.cycle_label }}</span>
  {% else %}
    <span class="mood-chip mood-unknown">風度尚未更新</span>
  {% endif %}
</nav>
